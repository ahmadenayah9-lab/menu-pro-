<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12071a">
<title>رسالة إلك 🤍</title>
<meta property="og:title" content="رسالة إلك 🤍">
<meta property="og:description" content="في شي صغير جهزتلك إياه">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#e2bf7d;--rose:#e58aa0;--cream:#f8ecdd}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Aref Ruqaa",serif;color:var(--cream);min-height:100vh;min-height:100dvh;overflow-x:hidden;
background:radial-gradient(110% 70% at 50% 115%,#6a1f40 0,transparent 62%),linear-gradient(180deg,#12071a,#2b0f2d 70%,#3a1230)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.stage{position:relative;min-height:100vh;min-height:100dvh;display:grid;place-items:center;text-align:center;
padding:max(6vh,env(safe-area-inset-top)) 7vw max(6vh,env(safe-area-inset-bottom))}
.scene{display:none;width:100%;max-width:560px;animation:in .9s ease both}
.scene.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes glow{50%{box-shadow:0 10px 44px -2px var(--rose)}}
.moon{width:58px;height:58px;margin:0 auto 1.6rem;border-radius:50%;box-shadow:inset -15px -7px 0 0 var(--gold);transform:rotate(-25deg);filter:drop-shadow(0 0 16px rgba(226,191,125,.55))}
h1,h2{font-size:clamp(2.4rem,11vw,4rem);line-height:1.7;padding:.1em 0;background:linear-gradient(135deg,#f6e3b4,var(--gold) 45%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(2rem,8.5vw,3rem)}
.sub{font-size:1.3rem;line-height:1.9;opacity:.85;margin:.3rem 0 1.8rem}
.card{padding:2.4rem 1.5rem;margin-bottom:1.6rem;border:1px solid rgba(226,191,125,.35);border-radius:28px;background:rgba(255,255,255,.05);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 30px 80px -30px #000}
.msg{font-size:clamp(1.55rem,6vw,2.2rem);line-height:2}
.w{display:inline-block;opacity:0;animation:in .8s ease forwards}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:1.6rem}
.dots i{width:7px;height:7px;border-radius:9px;background:rgba(248,236,221,.25);transition:.4s}
.dots i.on{width:22px;background:var(--gold)}
.btn{display:inline-block;margin:.4rem;padding:.8rem 1.8rem;border-radius:999px;border:1px solid var(--gold);background:none;color:var(--cream);font:inherit;font-size:1.2rem;cursor:pointer;text-decoration:none;transition:.25s}
.btn:hover{background:rgba(226,191,125,.14)}
.btn:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.btn.main{border:0;color:#2a0f1e;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--rose));box-shadow:0 10px 30px -10px var(--rose)}
.btn.main:hover{filter:brightness(1.08)}
.pulse{animation:glow 2.4s ease-in-out infinite}
.soft{border-color:transparent;opacity:.75;font-size:1.05rem}
@media (prefers-reduced-motion:reduce){.scene,.w,.pulse{animation:none;opacity:1}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main class="stage">

  <section class="scene on" id="gate">
    <div class="moon"></div>
    <h1 id="gTo"></h1>
    <p class="sub" id="gSub"></p>
    <button class="btn main pulse" id="gBtn">افتحي 🤍</button>
  </section>

  <section class="scene" id="story">
    <div class="card"><p class="msg" id="msg" aria-live="polite"></p></div>
    <div class="dots" id="dots"></div>
    <button class="btn main" id="nxt">التالي</button>
  </section>

  <section class="scene" id="ask">
    <div class="moon"></div>
    <h2 id="q"></h2>
    <p class="sub" id="qFrom"></p>
    <div>
      <button class="btn main pulse" id="yes"></button>
      <button class="btn" id="think"></button>
      <button class="btn soft" id="no"></button>
    </div>
  </section>

  <section class="scene" id="yesS">
    <h2 id="yT"></h2>
    <p class="sub" id="yX"></p>
    <div id="links"></div>
  </section>

  <section class="scene" id="thinkS">
    <div class="card"><p class="msg" id="tX"></p></div>
    <button class="btn" data-go="ask">رجوع</button>
  </section>

  <section class="scene" id="noS">
    <div class="card"><p class="msg" id="nX"></p></div>
  </section>

</main>

<script src="for-you-config.js"></script>
<script>
(()=>{
const C=LOVE,$=s=>document.querySelector(s);
const to=(new URLSearchParams(location.search).get("to")||C.to).trim();
const f=t=>t.replace(/\{to\}/g,to).replace(/\{from\}/g,C.from);
const show=id=>document.querySelectorAll(".scene").forEach(e=>e.classList.toggle("on",e.id===id));

[["gTo",C.gateTitle],["gSub",C.gateText],["q",C.question],["yT",C.yesTitle],["yX",C.yesText],["tX",C.thinkText],["nX",C.noText]]
  .forEach(([i,t])=>{$("#"+i).textContent=f(t)});
$("#qFrom").textContent="— "+C.from;
$("#yes").textContent=C.yesBtn;$("#think").textContent=C.thinkBtn;$("#no").textContent=C.noBtn;
if(!C.allowDecline)$("#no").style.display="none";

// ---- القصة: كل جملة تظهر كلمة كلمة ----
let i=0;const dots=$("#dots");
C.messages.forEach(()=>dots.appendChild(document.createElement("i")));
function step(){
  const m=$("#msg");m.textContent="";
  f(C.messages[i]).split(" ").forEach((w,k)=>{
    const s=document.createElement("span");s.className="w";s.textContent=w;
    s.style.animationDelay=(k*.16)+"s";m.append(s," ");
  });
  [...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i));
  $("#nxt").textContent=i<C.messages.length-1?"التالي":"كمّلي 🤍";
}
$("#gBtn").onclick=()=>{show("story");step()};
$("#nxt").onclick=()=>{if(i<C.messages.length-1){i++;step()}else show("ask")};

// ---- الجواب ----
$("#yes").onclick=()=>{burst();show("yesS")};
$("#think").onclick=()=>show("thinkS");
$("#no").onclick=()=>show("noS");
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));

// ---- طرق التواصل (بتظهر بس اللي عبّيتها بالكونفيج) ----
const u=v=>v.replace("@","").trim(),L=[];
if(C.whatsapp)L.push(["واتساب","https://wa.me/"+C.whatsapp.replace(/\D/g,"")+"?text="+encodeURIComponent(f(C.replyText))]);
if(C.instagram)L.push(["إنستغرام","https://instagram.com/"+u(C.instagram)]);
if(C.telegram)L.push(["تيليغرام","https://t.me/"+u(C.telegram)]);
if(C.snapchat)L.push(["سناب شات","https://www.snapchat.com/add/"+u(C.snapchat)]);
L.forEach(([n,h],k)=>{
  const a=document.createElement("a");a.className="btn"+(k?"":" main");
  a.href=h;a.target="_blank";a.rel="noopener";a.textContent=n;$("#links").append(a);
});

// ---- الخلفية: نجوم + قلوب طايرة + احتفال ----
const cv=$("#fx"),x=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion:reduce)").matches;
let W,H,S=[],P=[];
function size(){
  const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);
  S=Array.from({length:Math.round(W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,p:Math.random()*6,s:Math.random()+.5}));
}
addEventListener("resize",()=>{size();if(still)draw(0)});
size();
function draw(t){
  x.clearRect(0,0,W,H);x.fillStyle="#f8ecdd";
  S.forEach(s=>{x.globalAlpha=.3+.7*Math.abs(Math.sin(t/1000*s.s+s.p));x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()});
  if(!still&&Math.random()<.025)P.push({x:Math.random()*W,y:H+20,vx:(Math.random()-.5)*.4,vy:-.9-Math.random()*.8,g:0,l:2.2,s:10+Math.random()*12,c:"#e58aa0",ch:"♥",a:.35});
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l-=.006;x.globalAlpha=Math.max(0,Math.min(1,p.l))*p.a;x.fillStyle=p.c;x.font=p.s+"px serif";x.fillText(p.ch,p.x,p.y)});
  P=P.filter(p=>p.l>0);
  if(!still)requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
function burst(){
  if(still)return;
  for(let k=0;k<70;k++){const a=Math.random()*7,v=2+Math.random()*5;
    P.push({x:W/2,y:H/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:.08,l:1.3,s:12+Math.random()*14,c:k%2?"#e2bf7d":"#e58aa0",ch:k%3?"♥":"✦",a:1});}
}
})();
</script>
</body>
</html>
