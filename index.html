<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MENU PRO — <span id="site-title">المطعم</span></title>

  <!-- خطوط -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #070707;
      --card: #0f0f0f;
      --muted: #bdbdbd;
      --accent: #e7ad3e;
      --accent-2: #ffd76b;
      --glass: rgba(255,255,255,0.04);
      --radius: 14px;
      --max-width: 1100px;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Cairo",system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background: linear-gradient(180deg,var(--bg),#0b0b0b 60%);
      color:#fff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.45;
      display:flex;
      justify-content:center;
      padding:32px 16px;
    }

    .container{
      width:100%;
      max-width:var(--max-width);
    }

    /* Header / Hero */
    .hero{
      display:grid;
      grid-template-columns: 1fr 420px;
      gap:28px;
      align-items:center;
      margin-bottom:28px;
    }
    .brand{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      padding:28px;
      border-radius:var(--radius);
      box-shadow: 0 6px 30px rgba(0,0,0,0.6);
    }
    .brand-top{
      display:flex;
      gap:16px;
      align-items:center;
    }
    .logo{
      width:72px;
      height:72px;
      border-radius:16px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:30px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      color:#111;
      box-shadow: 0 6px 18px rgba(231,173,62,0.18);
    }
    .title{
      display:flex;
      flex-direction:column;
    }
    .title h1{margin:0;font-size:20px;font-weight:700}
    .title p{margin:4px 0 0;color:var(--muted);font-size:13px}

    .meta{
      display:flex;
      gap:12px;
      margin-top:18px;
      align-items:center;
      flex-wrap:wrap;
    }
    .pill{
      background:var(--glass);
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      color:var(--muted);
      display:inline-flex;
      gap:8px;
      align-items:center;
    }

    .hero-cta{
      background:linear-gradient(180deg,#0b0b0b, #0a0a0a);
      padding:20px;
      border-radius:var(--radius);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:stretch;
    }
    .offer-badge{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }
    .offer-info{
      display:flex;
      flex-direction:column;
    }
    .offer-info strong{font-size:16px}
    .price{
      font-weight:700;
      color:var(--accent);
      font-size:20px;
    }
    .old-price{
      text-decoration:line-through;
      color:var(--muted);
      font-size:13px;
      margin-left:8px;
    }

    .cta-row{
      display:flex;
      gap:10px;
      margin-top:6px;
    }
    .btn{
      flex:1;
      padding:12px 14px;
      border-radius:12px;
      border:0;
      cursor:pointer;
      font-weight:600;
      font-size:14px;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .btn:active{transform:translateY(1px)}
    .btn-primary{
      background:linear-gradient(90deg,var(--accent),var(--accent-2));
      color:#111;
      box-shadow: 0 8px 30px rgba(231,173,62,0.14);
    }
    .btn-outline{
      background:transparent;
      border:1px solid rgba(255,255,255,0.06);
      color:var(--muted);
    }

    /* Menu grid */
    .menu-grid{
      display:grid;
      grid-template-columns: repeat(3,1fr);
      gap:18px;
      margin-top:18px;
    }
    .card{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      padding:16px;
      border-radius:12px;
      display:flex;
      gap:12px;
      align-items:center;
      transition:transform .18s ease, box-shadow .18s ease;
      border:1px solid rgba(255,255,255,0.02);
    }
    .card:hover{
      transform:translateY(-6px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
    }
    .thumb{
      width:84px;
      height:84px;
      border-radius:10px;
      background:linear-gradient(135deg,#111,#1a1a1a);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-size:12px;
      flex-shrink:0;
    }
    .card-body{flex:1}
    .card-body h4{margin:0 0 6px 0;font-size:15px}
    .card-body p{margin:0;color:var(--muted);font-size:13px}
    .card-price{font-weight:700;color:var(--accent);font-size:16px}

    /* Footer */
    footer{
      margin-top:28px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      color:var(--muted);
      font-size:13px;
    }

    /* Responsive */
    @media (max-width:980px){
      .hero{grid-template-columns:1fr; padding-bottom:6px}
      .menu-grid{grid-template-columns:repeat(2,1fr)}
    }
    @media (max-width:560px){
      body{padding:18px 12px}
      .menu-grid{grid-template-columns:1fr}
      .logo{width:60px;height:60px;font-size:26px}
      .hero-cta{padding:14px}
      .card{padding:12px}
    }

    /* Accessibility focus */
    .btn:focus{outline:3px solid rgba(231,173,62,0.18); outline-offset:3px}
  </style>
</head>
<body>
  <div class="container" role="main">
    <header class="hero" aria-label="معلومات المطعم">
      <div class="brand" id="brand">
        <div class="brand-top">
          <div class="logo" id="logo">🔥</div>
          <div class="title">
            <h1 id="restaurantName">جمر وذهب</h1>
            <p id="subtitle">مطعم ومشاوي شرقية</p>
          </div>
        </div>

        <div class="meta" aria-hidden="false">
          <div class="pill" id="addressPill">📍 <span id="address">شارع الجامعة - عمّان</span></div>
          <div class="pill" id="timePill">⏱ <span id="openingHours">يومياً 11:00 ص — 1:00 ص</span></div>
          <div class="pill" id="ratingPill">⭐ <span id="rating">4.9</span> · <span id="reviews">+500</span></div>
        </div>
      </div>

      <aside class="hero-cta" aria-label="عرض اليوم">
        <div class="offer-badge">
          <div class="offer-info">
            <div style="display:flex;align-items:center;gap:8px">
              <span class="old-price" id="offerLabel">🔥 عرض اليوم</span>
            </div>
            <strong id="offerName">وجبة التوفير الذهبية</strong>
            <div style="display:flex;align-items:center;margin-top:6px">
              <div class="price" id="offerPrice">7.5 JOD</div>
              <div class="old-price" id="offerOld">9.5 JOD</div>
            </div>
          </div>
          <div style="text-align:center">
            <div style="font-size:12px;color:var(--muted)">توصيل</div>
            <div style="font-weight:700;margin-top:6px" id="deliveryTime">25–35 دقيقة</div>
          </div>
        </div>

        <div class="cta-row" role="group" aria-label="خيارات الطلب">
          <button class="btn btn-primary" id="orderNow">اطلب الآن</button>
          <button class="btn btn-outline" id="viewMenu">القائمة</button>
        </div>

        <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
          <a id="whatsappBtn" class="btn btn-outline" style="flex:1;text-decoration:none;display:inline-flex;align-items:center;justify-content:center" aria-label="اتصل عبر واتساب">💬 واتساب</a>
          <a id="callBtn" class="btn btn-outline" style="width:120px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center" aria-label="اتصال هاتفي">📞 اتصل</a>
        </div>
      </aside>
    </header>

    <!-- Menu preview -->
    <section aria-label="قائمة مختارة">
      <h3 style="margin:0 0 12px 0">أشهر الأصناف</h3>
      <div class="menu-grid" id="menuGrid">
        <!-- بطاقات عناصر افتراضية تُستبدل بالبيانات الحقيقية -->
      </div>
    </section>

    <footer>
      <div>© <span id="year"></span> <strong id="footerName">جمر وذهب</strong></div>
      <div id="contactFooter">📍 <span id="footerAddress">شارع الجامعة</span> · ☎️ <span id="footerPhone">0790000000</span></div>
    </footer>
  </div>

  <script>
    // افتراض وجود window.MENU_CONFIG من config.js
    const cfg = window.MENU_CONFIG || {};

    // مساعدة لتنسيق العملة
    function formatPrice(v){
      if (typeof v !== "number") return v;
      return v.toLocaleString(cfg.settings?.locale || "ar-JO", { style: "currency", currency: cfg.currency || "JOD" });
    }

    // ملء البيانات الأساسية
    document.getElementById('site-title').textContent = cfg.restaurantName || "المطعم";
    document.getElementById('restaurantName').textContent = cfg.restaurantName || "";
    document.getElementById('subtitle').textContent = cfg.subtitle || "";
    document.getElementById('logo').textContent = cfg.logo || "🍽";
    document.getElementById('address').textContent = cfg.address || "";
    document.getElementById('openingHours').textContent = cfg.openingHours || "";
    document.getElementById('rating').textContent = (cfg.rating !== undefined) ? cfg.rating : "";
    document.getElementById('reviews').textContent = cfg.reviews ? ("+" + cfg.reviews) : "";

    // العرض
    const offer = cfg.offer || {};
    if (offer.enabled) {
      document.getElementById('offerLabel').textContent = offer.label || "عرض";
      document.getElementById('offerName').textContent = offer.name || "";
      document.getElementById('offerPrice').textContent = formatPrice(offer.price) || "";
      document.getElementById('offerOld').textContent = offer.oldPrice ? formatPrice(offer.oldPrice) : "";
    } else {
      // إخفاء البلوك لو لم يكن هناك عرض
      document.querySelector('.hero-cta').style.display = 'none';
    }

    // أزرار الاتصال
    const whatsappBtn = document.getElementById('whatsappBtn');
    const callBtn = document.getElementById('callBtn');

    // بناء رابط واتساب بصيغة wa.me
    if (cfg.whatsapp) {
      const raw = String(cfg.whatsapp).replace(/\D/g,'');
      whatsappBtn.href = `https://wa.me/${raw}`;
      whatsappBtn.target = "_blank";
    } else {
      whatsappBtn.style.display = 'none';
    }

    if (cfg.phone) {
      const phoneRaw = String(cfg.phone).replace(/\s+/g,'');
      callBtn.href = `tel:${phoneRaw}`;
    } else {
      callBtn.style.display = 'none';
    }

    // زر اطلب الآن — مثال: يفتح قسم القائمة أو يضيف منتج العرض إلى سلة
    document.getElementById('orderNow').addEventListener('click', () => {
      // سلوك افتراضي: فتح رابط واتساب إن وُجد، وإلا إظهار تنبيه
      if (cfg.whatsapp) {
        window.open(`https://wa.me/${String(cfg.whatsapp).replace(/\D/g,'')}?text=${encodeURIComponent('أريد طلب العرض: ' + (offer.name || ''))}`, '_blank');
      } else {
        alert('يرجى الاتصال بالمطعم للطلب');
      }
    });

    // مثال بيانات أصناف افتراضية — استبدلها ببيانات حقيقية أو اجلبها من API
    const sampleItems = [
      { id:1, name:"برجر كلاسيك", desc:"لحم طازج، خبز محمص", price:4.5 },
      { id:2, name:"شيش طاووق", desc:"قطع دجاج متبلة ومشوية", price:6.0 },
      { id:3, name:"بطاطا مقلية", desc:"مقرمشة مع توابل", price:2.0 },
      { id:4, name:"كباب لحم", desc:"كباب مشوي على الفحم", price:7.0 },
      { id:5, name:"مشروب غازي", desc:"كولا أو سفن أب", price:1.5 },
      { id:6, name:"سلطة تبولة", desc:"طازجة وخفيفة", price:2.5 }
    ];

    const menuGrid = document.getElementById('menuGrid');
    const items = cfg.menuItems || sampleItems;
    items.slice(0,6).forEach(it => {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div class="thumb" aria-hidden="true">صورة</div>
        <div class="card-body">
          <h4>${it.name}</h4>
          <p>${it.desc || ''}</p>
        </div>
        <div class="card-price">${formatPrice(it.price)}</div>
      `;
      menuGrid.appendChild(card);
    });

    // Footer
    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('footerName').textContent = cfg.restaurantName || "";
    document.getElementById('footerAddress').textContent = cfg.address || "";
    document.getElementById('footerPhone').textContent = cfg.phone || "";

    // تحسينات صغيرة: ضبط ألوان من config.theme إن وُجدت
    if (cfg.theme) {
      try {
        if (cfg.theme.background) document.documentElement.style.setProperty('--bg', cfg.theme.background);
        if (cfg.theme.gold) document.documentElement.style.setProperty('--accent', cfg.theme.gold);
        if (cfg.theme.goldLight) document.documentElement.style.setProperty('--accent-2', cfg.theme.goldLight);
      } catch(e){}
    }
  </script>
</body>
</html>
