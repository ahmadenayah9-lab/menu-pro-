<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>بيت الشام | المنيو</title>
<meta name="description" content="منيو بيت الشام — مطبخ شامي أصيل">
 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
 
<style>
  /* ============ TOKENS ============ */
  :root{
    --clay:      #b5502e;   /* أحمر طيني — لون النحاس والفخار */
    --clay-dark: #8a3a1f;
    --clay-deep: #5c2718;
    --ink:       #241a15;   /* بني غامق شبه أسود — القهوة العربية */
    --ink-soft:  #3a2b22;
    --sand:      #f2e6d3;   /* رملي دافئ */
    --sand-lt:   #f8f1e4;
    --paper:     #fbf6ec;
    --gold:      #c99a3f;   /* نحاسي/ذهبي */
    --gold-lt:   #e0bd72;
    --sage:      #6b8266;   /* أخضر زيتوني للـ tags النباتية */
    --line:      rgba(36,26,21,0.12);
    --line-lt:   rgba(251,246,236,0.18);
 
    --f-display: "Reem Kufi", "Cairo", sans-serif;
    --f-body:    "Cairo", sans-serif;
 
    --radius: 4px;
    --shadow-lift: 0 12px 32px -8px rgba(36,26,21,0.35);
    --shadow-soft: 0 4px 16px -4px rgba(36,26,21,0.18);
  }
 
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--f-body);
    line-height:1.6;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  img{ max-width:100%; display:block; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; }
  ul{ list-style:none; }
  a{ color:inherit; text-decoration:none; }
 
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
  }
 
  /* ============ TEXTURE / PATTERN BG ============ */
  .zellige-bg{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.05;
    background-image:
      linear-gradient(135deg, var(--clay) 25%, transparent 25%),
      linear-gradient(225deg, var(--clay) 25%, transparent 25%),
      linear-gradient(45deg, var(--clay) 25%, transparent 25%),
      linear-gradient(315deg, var(--clay) 25%, var(--sand) 25%);
    background-position: 20px 0, 20px 0, 0 0, 0 0;
    background-size: 40px 40px;
    background-repeat: repeat;
  }
 
  /* ============ HERO ============ */
  .hero{
    position:relative;
    min-height:92vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    background: var(--ink);
    color: var(--sand-lt);
    padding: 5vh 6vw 8vh;
    overflow:hidden;
    isolation:isolate;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0; z-index:-2;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(181,80,46,0.35), transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(201,154,63,0.12), transparent 70%),
      linear-gradient(180deg, var(--ink) 0%, #1a120d 100%);
  }
  .hero-arch{
    position:absolute; z-index:-1; bottom:0; left:50%; transform:translateX(-50%);
    width:min(120vw, 1400px); height:70%;
    opacity:0.5;
  }
  .hero-eyebrow{
    font-family: var(--f-body);
    font-size: clamp(0.7rem, 1.4vw, 0.85rem);
    letter-spacing: 0.35em;
    color: var(--gold-lt);
    text-transform:uppercase;
    margin-bottom: 1.4rem;
    opacity:0;
    animation: riseIn 0.9s cubic-bezier(.2,.8,.2,1) 0.15s forwards;
  }
  .hero h1{
    font-family: var(--f-display);
    font-weight:700;
    font-size: clamp(3rem, 11vw, 7.5rem);
    line-height:1.05;
    letter-spacing:-0.01em;
    color: var(--paper);
    opacity:0;
    animation: riseIn 1s cubic-bezier(.2,.8,.2,1) 0.3s forwards;
  }
  .hero-tagline{
    margin-top: 1.5rem;
    font-size: clamp(1rem, 2.2vw, 1.35rem);
    color: var(--sand);
    font-weight:300;
    max-width: 32ch;
    opacity:0;
    animation: riseIn 1s cubic-bezier(.2,.8,.2,1) 0.5s forwards;
  }
  .hero-divider{
    width:1px; height:52px;
    background: linear-gradient(var(--gold-lt), transparent);
    margin: 2.4rem auto 0;
    opacity:0;
    animation: riseIn 1s ease 0.7s forwards;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }
 
  /* ============ STICKY NAV ============ */
  .navbar{
    position: sticky; top:0; z-index:50;
    background: rgba(251,246,236,0.92);
    backdrop-filter: blur(10px) saturate(1.2);
    -webkit-backdrop-filter: blur(10px) saturate(1.2);
    border-bottom: 1px solid var(--line);
    transition: box-shadow .3s ease;
  }
  .navbar.scrolled{ box-shadow: 0 4px 20px -8px rgba(36,26,21,0.15); }
  .navbar-inner{
    max-width:1180px; margin:0 auto;
    display:flex; align-items:center; gap:1.5rem;
    padding: 0.9rem 6vw;
  }
  .navbar-brand{
    font-family: var(--f-display);
    font-size:1.05rem; font-weight:700;
    color: var(--clay-deep);
    white-space:nowrap;
    flex-shrink:0;
  }
  .navbar-scroller{
    display:flex; gap:0.4rem;
    overflow-x:auto;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .navbar-scroller::-webkit-scrollbar{ display:none; }
  .nav-pill{
    flex-shrink:0;
    padding: 0.5rem 1.1rem;
    border-radius: 999px;
    font-size:0.88rem; font-weight:600;
    color: var(--ink-soft);
    border: 1px solid transparent;
    transition: all .25s ease;
    white-space:nowrap;
  }
  .nav-pill:hover{ background: var(--sand); }
  .nav-pill.active{
    background: var(--clay);
    color: var(--paper);
    box-shadow: var(--shadow-soft);
  }
 
  /* ============ SECTION LAYOUT ============ */
  .menu-wrap{ max-width:1180px; margin:0 auto; padding: 0 6vw; position:relative; z-index:1; }
 
  .category-section{
    padding: 5.5rem 0 2rem;
    scroll-margin-top: 84px;
    border-bottom: 1px solid var(--line);
  }
  .category-section:last-of-type{ border-bottom:none; }
 
  .cat-head{
    display:flex; align-items:flex-end; justify-content:space-between; gap:2rem;
    margin-bottom: 2.6rem;
    flex-wrap:wrap;
  }
  .cat-head-left{ display:flex; align-items:center; gap:1.1rem; }
  .cat-icon{
    width:52px; height:52px; flex-shrink:0;
    border-radius:50%;
    background: var(--sand);
    display:flex; align-items:center; justify-content:center;
    color: var(--clay);
  }
  .cat-icon svg{ width:24px; height:24px; }
  .cat-title{
    font-family: var(--f-display);
    font-weight:700;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    color: var(--ink);
    line-height:1.1;
  }
  .cat-subtitle{
    color: var(--clay);
    font-size:0.95rem;
    font-weight:500;
    margin-top:0.3rem;
  }
  .cat-count{
    font-family: var(--f-display);
    color: var(--line);
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    font-weight:700;
    line-height:1;
    opacity:0.6;
  }
 
  /* ============ DISH GRID ============ */
  .dish-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.1rem 1.6rem;
  }
  .dish{
    display:flex; align-items:flex-start; justify-content:space-between; gap:1rem;
    padding: 1.4rem 0;
    border-bottom: 1px dashed var(--line);
    opacity:0; transform:translateY(14px);
    animation: dishIn 0.6s ease forwards;
  }
  @keyframes dishIn{ to{ opacity:1; transform:translateY(0); } }
 
  .dish-main{ flex:1; min-width:0; }
  .dish-name-row{ display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap; margin-bottom:0.35rem; }
  .dish-name{
    font-family: var(--f-display);
    font-weight:700;
    font-size:1.15rem;
    color: var(--ink);
  }
  .dish-desc{
    color: var(--ink-soft);
    font-size:0.9rem;
    opacity:0.75;
    max-width:42ch;
  }
  .dish-price{
    font-family: var(--f-display);
    font-weight:700;
    font-size:1.15rem;
    color: var(--clay);
    white-space:nowrap;
    flex-shrink:0;
    padding-top:0.1rem;
  }
  .dish-price small{ font-family:var(--f-body); font-size:0.7rem; font-weight:600; opacity:0.7; margin-left:0.2rem; }
 
  .tag{
    display:inline-flex; align-items:center; gap:0.3rem;
    font-size:0.68rem; font-weight:700;
    padding: 0.18rem 0.55rem;
    border-radius: 999px;
    border:1px solid currentColor;
  }
  .tag::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
 
  /* ============ FOOTER ============ */
  .footer{
    background: var(--ink);
    color: var(--sand);
    padding: 5rem 6vw 3rem;
    margin-top: 3rem;
    position:relative;
    overflow:hidden;
  }
  .footer::before{
    content:""; position:absolute; top:0; left:0; right:0; height:4px;
    background: linear-gradient(90deg, var(--clay), var(--gold), var(--clay));
  }
  .footer-inner{
    max-width:1180px; margin:0 auto;
    display:grid; grid-template-columns: 1.3fr 1fr 1fr; gap:3rem;
  }
  .footer-brand{
    font-family:var(--f-display); font-weight:700; font-size:1.8rem;
    color:var(--paper); margin-bottom:0.8rem;
  }
  .footer-tagline{ opacity:0.65; font-size:0.92rem; max-width:32ch; }
  .footer-col h4{
    font-size:0.75rem; letter-spacing:0.18em; text-transform:uppercase;
    color: var(--gold-lt); margin-bottom:1rem; font-weight:700;
  }
  .footer-col p, .footer-col a{
    display:block; font-size:0.92rem; opacity:0.8; margin-bottom:0.6rem;
    transition: opacity .2s;
  }
  .footer-col a:hover{ opacity:1; color:var(--gold-lt); }
  .footer-bottom{
    max-width:1180px; margin:3.5rem auto 0; padding-top:1.6rem;
    border-top:1px solid var(--line-lt);
    font-size:0.78rem; opacity:0.5; text-align:center;
  }
 
  @media (max-width:760px){
    .footer-inner{ grid-template-columns:1fr; gap:2.2rem; }
    .cat-head{ align-items:flex-start; }
    .dish{ flex-direction:column; }
    .dish-price{ align-self:flex-start; }
  }
 
  /* ============ FLOATING QUICK-NAV (mobile) ============ */
  .fab-search{
    position:fixed; bottom:1.4rem; left:1.4rem; z-index:60;
    width:52px; height:52px; border-radius:50%;
    background: var(--clay);
    color: var(--paper);
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow-lift);
    transition: transform .2s ease;
  }
  .fab-search:active{ transform:scale(0.92); }
  .fab-search svg{ width:22px; height:22px; }
 
  /* ============ SEARCH OVERLAY ============ */
  .search-overlay{
    position:fixed; inset:0; z-index:70;
    background: rgba(36,26,21,0.72);
    backdrop-filter: blur(4px);
    display:flex; align-items:flex-start; justify-content:center;
    padding: 8vh 6vw;
    opacity:0; pointer-events:none;
    transition: opacity .25s ease;
  }
  .search-overlay.open{ opacity:1; pointer-events:all; }
  .search-box{
    background: var(--paper);
    width:100%; max-width:560px;
    border-radius: 12px;
    padding: 1.4rem;
    box-shadow: var(--shadow-lift);
    transform: translateY(-16px);
    transition: transform .25s ease;
  }
  .search-overlay.open .search-box{ transform:translateY(0); }
  .search-input-row{ display:flex; align-items:center; gap:0.7rem; border-bottom:2px solid var(--clay); padding-bottom:0.8rem; }
  .search-input-row svg{ width:20px; height:20px; color:var(--clay); flex-shrink:0; }
  #searchInput{
    flex:1; border:none; outline:none; background:none;
    font-family:var(--f-body); font-size:1.1rem; color:var(--ink);
  }
  .search-close{ color:var(--ink-soft); font-size:1.4rem; line-height:1; padding:0.2rem; }
  .search-results{ margin-top:1rem; max-height:52vh; overflow-y:auto; }
  .search-result-item{
    display:flex; justify-content:space-between; align-items:center; gap:1rem;
    padding:0.8rem 0.3rem; border-bottom:1px solid var(--line);
  }
  .search-result-item:hover{ background:var(--sand-lt); }
  .search-result-name{ font-weight:700; font-family:var(--f-display); }
  .search-result-cat{ font-size:0.75rem; color:var(--clay); }
  .search-empty{ text-align:center; opacity:0.5; padding:2rem 0; font-size:0.9rem; }
 
  /* ============ SCROLL PROGRESS ============ */
  .progress-bar{
    position:fixed; top:0; left:0; height:3px; z-index:80;
    background: linear-gradient(90deg, var(--gold), var(--clay));
    width:0%;
    transition: width .1s linear;
  }
 
  /* ============ ADD-TO-ORDER CONTROLS ON DISH ============ */
  .dish{ position:relative; }
  .dish-add-row{
    display:flex; align-items:center; gap:0.6rem;
    margin-top:0.7rem;
    flex-shrink:0;
  }
  .qty-stepper{
    display:flex; align-items:center;
    border:1.5px solid var(--clay); border-radius:999px;
    overflow:hidden;
    background:var(--paper);
  }
  .qty-stepper button{
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    color:var(--clay); font-size:1.1rem; font-weight:700;
    transition: background .2s;
  }
  .qty-stepper button:hover{ background:var(--sand); }
  .qty-stepper span{
    min-width:22px; text-align:center;
    font-family:var(--f-display); font-weight:700; font-size:0.95rem;
    color:var(--ink);
  }
  .btn-add{
    display:flex; align-items:center; gap:0.4rem;
    padding:0.5rem 1.1rem;
    border-radius:999px;
    background:var(--clay);
    color:var(--paper);
    font-size:0.82rem; font-weight:700;
    transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
    box-shadow: var(--shadow-soft);
  }
  .btn-add:hover{ background:var(--clay-dark); }
  .btn-add:active{ transform:scale(0.95); }
  .btn-add svg{ width:15px; height:15px; }
  .btn-add.added{ background:var(--sage); }
 
  .dish-right{ display:flex; flex-direction:column; align-items:flex-end; gap:0.2rem; flex-shrink:0; }
 
  /* ============ FLOATING ORDER BUTTON ============ */
  .fab-order{
    position:fixed; bottom:1.4rem; right:1.4rem; z-index:60;
    display:flex; align-items:center; gap:0.6rem;
    padding: 0.9rem 1.3rem 0.9rem 1.1rem;
    border-radius:999px;
    background: var(--ink);
    color: var(--paper);
    box-shadow: var(--shadow-lift);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
    transform: translateY(120%) scale(0.9);
    opacity:0;
  }
  .fab-order.visible{ transform:translateY(0) scale(1); opacity:1; }
  .fab-order:active{ transform:scale(0.94); }
  .fab-order svg{ width:20px; height:20px; color:var(--gold-lt); }
  .fab-order-count{
    background: var(--clay);
    color:var(--paper);
    font-family:var(--f-display); font-weight:700; font-size:0.82rem;
    min-width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    padding:0 0.3rem;
  }
  .fab-order-total{ font-family:var(--f-display); font-weight:700; font-size:0.95rem; }
  .fab-order-label{ font-size:0.78rem; opacity:0.75; }
 
  /* ============ CART DRAWER ============ */
  .cart-scrim{
    position:fixed; inset:0; z-index:90;
    background: rgba(36,26,21,0.55);
    backdrop-filter: blur(3px);
    opacity:0; pointer-events:none;
    transition: opacity .3s ease;
  }
  .cart-scrim.open{ opacity:1; pointer-events:all; }
 
  .cart-drawer{
    position:fixed; top:0; bottom:0; left:0;
    z-index:91;
    width:min(440px, 100vw);
    background: var(--paper);
    display:flex; flex-direction:column;
    box-shadow: 20px 0 50px -12px rgba(36,26,21,0.4);
    transform: translateX(-100%);
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  html[dir="rtl"] .cart-drawer{ left:0; transform:translateX(-100%); }
  .cart-drawer.open{ transform:translateX(0); }
 
  .cart-head{
    padding: 1.6rem 1.6rem 1.2rem;
    background: var(--ink);
    color: var(--sand-lt);
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
    position:relative;
    overflow:hidden;
  }
  .cart-head::before{
    content:""; position:absolute; inset:0;
    background: radial-gradient(ellipse 80% 100% at 100% 0%, rgba(181,80,46,0.4), transparent 70%);
  }
  .cart-head-title{
    font-family:var(--f-display); font-weight:700; font-size:1.5rem;
    position:relative; z-index:1;
  }
  .cart-head-sub{ font-size:0.8rem; opacity:0.65; margin-top:0.2rem; position:relative; z-index:1; }
  .cart-close{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(251,246,236,0.1);
    color:var(--sand-lt); font-size:1.3rem;
    flex-shrink:0; position:relative; z-index:1;
    transition: background .2s;
  }
  .cart-close:hover{ background: rgba(251,246,236,0.2); }
 
  .cart-body{ flex:1; overflow-y:auto; padding: 1.2rem 1.6rem; }
  .cart-empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; text-align:center; color:var(--ink-soft); opacity:0.5;
    gap:0.8rem; padding: 3rem 1rem;
  }
  .cart-empty svg{ width:56px; height:56px; opacity:0.4; }
 
  .cart-line{
    display:flex; align-items:center; gap:0.9rem;
    padding: 1rem 0;
    border-bottom: 1px dashed var(--line);
  }
  .cart-line-info{ flex:1; min-width:0; }
  .cart-line-name{ font-family:var(--f-display); font-weight:700; font-size:1rem; color:var(--ink); }
  .cart-line-price{ font-size:0.82rem; color:var(--clay); margin-top:0.15rem; font-weight:600; }
  .cart-line-remove{
    color:var(--ink-soft); opacity:0.4; font-size:1.1rem; padding:0.3rem;
    transition: opacity .2s, color .2s;
  }
  .cart-line-remove:hover{ opacity:1; color:var(--clay); }
 
  .cart-notes{
    margin-top:0.5rem;
  }
  .cart-notes label{
    display:block; font-size:0.78rem; font-weight:700; color:var(--ink-soft);
    margin-bottom:0.5rem;
  }
  .field{
    width:100%;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 0.75rem 0.9rem;
    font-family:var(--f-body); font-size:0.92rem; color:var(--ink);
    background: var(--sand-lt);
    transition: border-color .2s;
    outline:none;
  }
  .field:focus{ border-color:var(--clay); }
  textarea.field{ resize:vertical; min-height:64px; font-family:inherit; }
 
  .cart-section-label{
    font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase;
    color: var(--clay); font-weight:700; margin: 1.4rem 0 0.7rem;
  }
 
  .cart-foot{
    flex-shrink:0; padding: 1.2rem 1.6rem 1.6rem;
    border-top: 1px solid var(--line);
    background: var(--sand-lt);
  }
  .cart-total-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 1rem;
  }
  .cart-total-label{ font-size:0.95rem; color:var(--ink-soft); font-weight:600; }
  .cart-total-value{ font-family:var(--f-display); font-weight:700; font-size:1.6rem; color:var(--clay); }
 
  .btn-checkout{
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:0.6rem;
    padding: 1rem;
    border-radius: 12px;
    background: linear-gradient(135deg, #25d366, #1eb857);
    color:#fff;
    font-family:var(--f-display); font-weight:700; font-size:1.05rem;
    box-shadow: 0 8px 20px -6px rgba(37,211,102,0.5);
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .btn-checkout:hover{ transform:translateY(-2px); box-shadow: 0 12px 26px -6px rgba(37,211,102,0.6); }
  .btn-checkout:active{ transform:translateY(0) scale(0.98); }
  .btn-checkout svg{ width:20px; height:20px; }
  .btn-checkout:disabled{ opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }
 
  .field-error{
    color: var(--clay); font-size:0.76rem; margin-top:0.35rem;
    display:none; font-weight:600;
  }
  .field.invalid{ border-color: var(--clay); }
  .field.invalid + .field-error{ display:block; }
 
  /* order success toast */
  .order-toast{
    position:fixed; bottom:1.4rem; left:50%; z-index:100;
    transform:translateX(-50%) translateY(140%);
    background: var(--ink); color:var(--sand-lt);
    padding: 1rem 1.6rem; border-radius: 12px;
    display:flex; align-items:center; gap:0.7rem;
    box-shadow: var(--shadow-lift);
    font-size:0.9rem; font-weight:600;
    transition: transform .4s cubic-bezier(.2,.8,.2,1);
    white-space:nowrap;
  }
  .order-toast.show{ transform:translateX(-50%) translateY(0); }
  .order-toast svg{ width:20px; height:20px; color:#25d366; flex-shrink:0; }
 
  @media (max-width:480px){
    .cart-drawer{ width:100vw; }
    .fab-order-label{ display:none; }
  }
</style>
</head>
<body>
 
<div class="zellige-bg"></div>
<div class="progress-bar" id="progressBar"></div>
 
<!-- ============ HERO ============ -->
<header class="hero">
  <svg class="hero-arch" viewBox="0 0 800 500" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path d="M0,500 L0,320 Q400,-40 800,320 L800,500 Z" fill="none" stroke="var(--gold-lt)" stroke-width="1" opacity="0.3"/>
    <path d="M60,500 L60,340 Q400,50 740,340 L740,500 Z" fill="none" stroke="var(--gold-lt)" stroke-width="1" opacity="0.2"/>
  </svg>
  <p class="hero-eyebrow" id="heroEyebrow">مطبخ شامي أصيل · منذ الجدّات</p>
  <h1 id="heroTitle">بيت الشام</h1>
  <p class="hero-tagline" id="heroTagline">مطبخ شامي أصيل، نكهة ما بتتكرر</p>
  <div class="hero-divider"></div>
</header>
 
<!-- ============ NAV ============ -->
<nav class="navbar" id="navbar">
  <div class="navbar-inner">
    <span class="navbar-brand" id="navBrand">بيت الشام</span>
    <div class="navbar-scroller" id="navScroller"></div>
  </div>
</nav>
 
<!-- ============ MENU SECTIONS (rendered by JS) ============ -->
<main class="menu-wrap" id="menuWrap"></main>
 
<!-- ============ FOOTER ============ -->
<footer class="footer">
  <div class="footer-inner">
    <div>
      <div class="footer-brand" id="footBrand">بيت الشام</div>
      <p class="footer-tagline" id="footTagline">مطبخ شامي أصيل، نكهة ما بتتكرر</p>
    </div>
    <div class="footer-col">
      <h4>تواصل معنا</h4>
      <a id="footPhone" href="#"></a>
      <p id="footAddress"></p>
    </div>
    <div class="footer-col">
      <h4>أوقات الدوام</h4>
      <p id="footHours"></p>
      <a id="footInsta" href="#" target="_blank" rel="noopener"></a>
    </div>
  </div>
  <div class="footer-bottom">© <span id="yearNow"></span> — جميع الحقوق محفوظة</div>
</footer>
 
<!-- ============ FLOATING SEARCH BUTTON ============ -->
<button class="fab-search" id="fabSearch" aria-label="بحث بالمنيو">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
</button>
 
<!-- ============ SEARCH OVERLAY ============ -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-box">
    <div class="search-input-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="دور على أكلة...">
      <button class="search-close" id="searchClose" aria-label="إغلاق">×</button>
    </div>
    <div class="search-results" id="searchResults">
      <p class="search-empty">اكتب اسم الأكلة أو نوعها...</p>
    </div>
  </div>
</div>
 
<!-- ============ FLOATING ORDER BUTTON ============ -->
<button class="fab-order" id="fabOrder" aria-label="عرض الطلب">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12L6 6z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
  <span class="fab-order-count" id="fabOrderCount">0</span>
  <span>
    <div class="fab-order-total" id="fabOrderTotal">٠٫٠٠</div>
    <div class="fab-order-label">اطلب الآن</div>
  </span>
</button>
 
<!-- ============ CART DRAWER ============ -->
<div class="cart-scrim" id="cartScrim"></div>
<aside class="cart-drawer" id="cartDrawer" role="dialog" aria-label="طلبك">
  <div class="cart-head">
    <div>
      <div class="cart-head-title">طلبك</div>
      <div class="cart-head-sub" id="cartHeadSub">السلة فاضية</div>
    </div>
    <button class="cart-close" id="cartClose" aria-label="إغلاق">×</button>
  </div>
 
  <div class="cart-body" id="cartBody">
    <!-- filled by JS -->
  </div>
 
  <div class="cart-foot" id="cartFoot" style="display:none;">
    <div class="cart-total-row">
      <span class="cart-total-label">المجموع الكلي</span>
      <span class="cart-total-value" id="cartTotalValue">٠٫٠٠</span>
    </div>
    <button class="btn-checkout" id="btnCheckout">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5C10 9 9.4 7.6 9.1 7c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-1 1-1 2.4s1 2.8 1.1 3c.1.2 2 3 4.8 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 2-1.4.2-.7.2-1.2.1-1.4-.1-.1-.3-.2-.6-.3z"/><path d="M12 2a10 10 0 00-8.5 15.3L2 22l4.8-1.5A10 10 0 1012 2z"/></svg>
      إرسال الطلب عبر واتساب
    </button>
  </div>
</aside>
 
<!-- ============ ORDER SUCCESS TOAST ============ -->
<div class="order-toast" id="orderToast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="orderToastText">تم إرسال طلبك، بيوصلنا خلال ثواني!</span>
</div>
 
<script src="config.js"></script>
<script>
(function(){
  "use strict";
 
  // ---------- ICONS ----------
  const ICONS = {
    leaf:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 20A7 7 0 019.8 6.1C15.5 5 20 5.5 20 5.5S19.6 8.6 19 10c-2 4.5-6 5-8 5"/><path d="M12 20C11 15 9 11 4 8"/></svg>',
    salad: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 12c0-4 3-7 7-7 0 4-3 7-7 7z"/><path d="M12 12c0-3-2.5-5.5-6-5.5 0 3 2.5 5.5 6 5.5z"/><path d="M4 14c1 5 4 8 8 8s7-3 8-8H4z"/></svg>',
    flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2s5 4.5 5 10a5 5 0 01-10 0c0-1.5.7-2.5 1.5-3.5.3 1 1 1.5 1.5 1.5-.3-3 1-5.5 2-8z"/></svg>',
    pot:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11h16v3a6 6 0 01-6 6H10a6 6 0 01-6-6v-3z"/><path d="M2 11h20M8 11V8m8 3V8" /><circle cx="8" cy="6" r="1"/><circle cx="16" cy="6" r="1"/></svg>',
    wrap:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8c0-2 3-4 7-4s7 2 7 4-3 3-3 3H8s-3-1-3-3z"/><path d="M6 11l1.5 9h9L18 11"/></svg>',
    sweet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="9" width="16" height="10" rx="1.5"/><path d="M4 9l3-5h10l3 5"/><path d="M9 13v3M12 13v3M15 13v3"/></svg>',
    cup:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 4h11v9a5.5 5.5 0 01-5.5 5.5A5.5 5.5 0 015 13V4z"/><path d="M16 7h1.5a2.5 2.5 0 010 5H16"/><path d="M7 20h6"/></svg>',
  };
 
  // ---------- HERO / BRAND TEXT ----------
  document.title = RESTAURANT.name + " | المنيو";
  ["heroTitle","navBrand","footBrand"].forEach(id => document.getElementById(id).textContent = RESTAURANT.name);
  ["heroTagline","footTagline"].forEach(id => document.getElementById(id).textContent = RESTAURANT.tagline);
  document.getElementById("footPhone").textContent = RESTAURANT.phone;
  document.getElementById("footPhone").href = "tel:" + RESTAURANT.phone.replace(/\s/g,"");
  document.getElementById("footAddress").textContent = RESTAURANT.address;
  document.getElementById("footHours").textContent = RESTAURANT.hours;
  document.getElementById("footInsta").textContent = RESTAURANT.instagram;
  document.getElementById("footInsta").href = "https://instagram.com/" + RESTAURANT.instagram.replace("@","");
  document.getElementById("yearNow").textContent = new Date().getFullYear();
 
  // ---------- BUILD NAV PILLS ----------
  const navScroller = document.getElementById("navScroller");
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "nav-pill";
    btn.textContent = cat.name;
    btn.dataset.target = cat.id;
    btn.addEventListener("click", () => {
      document.getElementById("sec-" + cat.id).scrollIntoView({behavior:"smooth", block:"start"});
    });
    navScroller.appendChild(btn);
  });
  const navPills = [...navScroller.querySelectorAll(".nav-pill")];
 
  // ---------- BUILD MENU SECTIONS ----------
  const wrap = document.getElementById("menuWrap");
  const tagChip = (t) => {
    const conf = TAGS[t];
    if(!conf) return "";
    return `<span class="tag" style="color:${conf.color}">${conf.label}</span>`;
  };
 
  CATEGORIES.forEach((cat, ci) => {
    const items = MENU[cat.id] || [];
    const section = document.createElement("section");
    section.className = "category-section";
    section.id = "sec-" + cat.id;
 
    section.innerHTML = `
      <div class="cat-head">
        <div class="cat-head-left">
          <div class="cat-icon">${ICONS[cat.icon] || ICONS.leaf}</div>
          <div>
            <h2 class="cat-title">${cat.name}</h2>
            <div class="cat-subtitle">${cat.subtitle}</div>
          </div>
        </div>
        <div class="cat-count">${String(ci+1).padStart(2,"0")}</div>
      </div>
      <div class="dish-grid"></div>
    `;
 
    const grid = section.querySelector(".dish-grid");
    items.forEach((dish, di) => {
      const dishId = cat.id + "__" + di; // معرّف ثابت لكل صنف
      const el = document.createElement("div");
      el.className = "dish";
      el.style.animationDelay = (di * 0.05) + "s";
      el.dataset.dishId = dishId;
      const tags = (dish.tags||[]).map(tagChip).join("");
      el.innerHTML = `
        <div class="dish-main">
          <div class="dish-name-row">
            <span class="dish-name">${dish.name}</span>
            ${tags}
          </div>
          <p class="dish-desc">${dish.desc || ""}</p>
        </div>
        <div class="dish-right">
          <div class="dish-price">${dish.price.toFixed(2)}<small>${RESTAURANT.currency}</small></div>
          <div class="dish-add-row" data-dish-id="${dishId}"></div>
        </div>
      `;
      grid.appendChild(el);
    });
 
    wrap.appendChild(section);
  });
 
  // build lookup: dishId -> {name, price, catName}
  const DISH_LOOKUP = {};
  CATEGORIES.forEach(cat => {
    (MENU[cat.id]||[]).forEach((dish, di) => {
      DISH_LOOKUP[cat.id + "__" + di] = { name: dish.name, price: dish.price, catName: cat.name };
    });
  });
 
  // ---------- SCROLL SPY + PROGRESS ----------
  const sections = CATEGORIES.map(c => document.getElementById("sec-" + c.id));
  const navbar = document.getElementById("navbar");
  const progressBar = document.getElementById("progressBar");
 
  function onScroll(){
    const y = window.scrollY;
    navbar.classList.toggle("scrolled", y > 40);
 
    // progress
    const doc = document.documentElement;
    const total = doc.scrollHeight - doc.clientHeight;
    progressBar.style.width = total > 0 ? (y/total*100) + "%" : "0%";
 
    // spy
    let activeIdx = 0;
    const navH = navbar.offsetHeight + 20;
    sections.forEach((sec, i) => {
      if(sec.getBoundingClientRect().top - navH <= 0) activeIdx = i;
    });
    navPills.forEach((p,i) => p.classList.toggle("active", i === activeIdx));
    if(navPills[activeIdx]){
      navPills[activeIdx].scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
    }
  }
  window.addEventListener("scroll", onScroll, {passive:true});
  onScroll();
 
  // ---------- SEARCH ----------
  const fabSearch = document.getElementById("fabSearch");
  const overlay = document.getElementById("searchOverlay");
  const searchInput = document.getElementById("searchInput");
  const searchResults = document.getElementById("searchResults");
  const searchClose = document.getElementById("searchClose");
 
  // flatten all dishes for search
  const ALL_DISHES = [];
  CATEGORIES.forEach(cat => {
    (MENU[cat.id]||[]).forEach(dish => {
      ALL_DISHES.push({...dish, catName: cat.name, catId: cat.id});
    });
  });
 
  function openSearch(){
    overlay.classList.add("open");
    setTimeout(() => searchInput.focus(), 150);
  }
  function closeSearch(){
    overlay.classList.remove("open");
    searchInput.value = "";
    searchResults.innerHTML = '<p class="search-empty">اكتب اسم الأكلة أو نوعها...</p>';
  }
  fabSearch.addEventListener("click", openSearch);
  searchClose.addEventListener("click", closeSearch);
  overlay.addEventListener("click", (e) => { if(e.target === overlay) closeSearch(); });
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeSearch(); });
 
  searchInput.addEventListener("input", () => {
    const q = searchInput.value.trim();
    if(!q){ searchResults.innerHTML = '<p class="search-empty">اكتب اسم الأكلة أو نوعها...</p>'; return; }
    const matches = ALL_DISHES.filter(d =>
      d.name.includes(q) || (d.desc && d.desc.includes(q)) || d.catName.includes(q)
    );
    if(matches.length === 0){
      searchResults.innerHTML = '<p class="search-empty">ما لقينا نتائج، جرب كلمة ثانية</p>';
      return;
    }
    searchResults.innerHTML = matches.map(d => `
      <div class="search-result-item" data-cat="${d.catId}">
        <div>
          <div class="search-result-name">${d.name}</div>
          <div class="search-result-cat">${d.catName}</div>
        </div>
        <div class="dish-price">${d.price.toFixed(2)}<small>${RESTAURANT.currency}</small></div>
      </div>
    `).join("");
    searchResults.querySelectorAll(".search-result-item").forEach(item => {
      item.addEventListener("click", () => {
        closeSearch();
        document.getElementById("sec-" + item.dataset.cat).scrollIntoView({behavior:"smooth"});
      });
    });
  });
 
  // ================================================================
  // ============ نظام الطلب (السلة + واتساب) ============
  // ================================================================
 
  const cart = {}; // { dishId: qty }
  let custNameVal = "";
  let custPhoneVal = "";
  let custNotesVal = "";
 
  const fmt = (n) => n.toFixed(2);
 
  function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b, 0); }
  function cartTotal(){
    return Object.entries(cart).reduce((sum, [id, qty]) => sum + DISH_LOOKUP[id].price * qty, 0);
  }
 
  // ---------- render add-row buttons for every dish ----------
  function renderAddRow(dishId){
    const row = document.querySelector(`.dish-add-row[data-dish-id="${dishId}"]`);
    if(!row) return;
    const qty = cart[dishId] || 0;
 
    if(qty === 0){
      row.innerHTML = `
        <button class="btn-add" data-action="add" data-id="${dishId}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          أضف للطلب
        </button>`;
    } else {
      row.innerHTML = `
        <div class="qty-stepper">
          <button data-action="inc" data-id="${dishId}" aria-label="زيادة">+</button>
          <span>${qty}</span>
          <button data-action="dec" data-id="${dishId}" aria-label="إنقاص">−</button>
        </div>`;
    }
  }
 
  function renderAllAddRows(){
    Object.keys(DISH_LOOKUP).forEach(renderAddRow);
  }
  renderAllAddRows();
 
  // event delegation for add/inc/dec buttons across the whole page
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action][data-id]");
    if(!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
 
    if(action === "add" || action === "inc"){
      cart[id] = (cart[id] || 0) + 1;
    } else if(action === "dec"){
      cart[id] = (cart[id] || 0) - 1;
      if(cart[id] <= 0) delete cart[id];
    } else if(action === "remove"){
      delete cart[id];
    }
 
    renderAddRow(id);
    updateFab();
    renderCartBody();
  });
 
  // ---------- floating order button ----------
  const fabOrder = document.getElementById("fabOrder");
  const fabOrderCount = document.getElementById("fabOrderCount");
  const fabOrderTotal = document.getElementById("fabOrderTotal");
 
  function updateFab(){
    const count = cartCount();
    fabOrder.classList.toggle("visible", count > 0);
    fabOrderCount.textContent = count;
    fabOrderTotal.textContent = fmt(cartTotal()) + " " + RESTAURANT.currency;
  }
  updateFab();
 
  // ---------- cart drawer ----------
  const cartScrim = document.getElementById("cartScrim");
  const cartDrawer = document.getElementById("cartDrawer");
  const cartClose = document.getElementById("cartClose");
  const cartBody = document.getElementById("cartBody");
  const cartFoot = document.getElementById("cartFoot");
  const cartHeadSub = document.getElementById("cartHeadSub");
  const cartTotalValue = document.getElementById("cartTotalValue");
 
  function openCart(){
    cartScrim.classList.add("open");
    cartDrawer.classList.add("open");
    document.body.style.overflow = "hidden";
    renderCartBody();
  }
  function closeCart(){
    cartScrim.classList.remove("open");
    cartDrawer.classList.remove("open");
    document.body.style.overflow = "";
  }
  fabOrder.addEventListener("click", openCart);
  cartClose.addEventListener("click", closeCart);
  cartScrim.addEventListener("click", closeCart);
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeCart(); });
 
  function renderCartBody(){
    const ids = Object.keys(cart);
 
    if(ids.length === 0){
      cartHeadSub.textContent = "السلة فاضية";
      cartFoot.style.display = "none";
      cartBody.innerHTML = `
        <div class="cart-empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6h15l-1.5 9h-12L6 6z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
          <p>لسا ما ضفت شي... تصفح المنيو واختار اللي بشهيك</p>
        </div>`;
      return;
    }
 
    cartHeadSub.textContent = cartCount() + " صنف بسلتك";
    cartFoot.style.display = "block";
    cartTotalValue.textContent = fmt(cartTotal()) + " " + RESTAURANT.currency;
 
    const linesHtml = ids.map(id => {
      const item = DISH_LOOKUP[id];
      const qty = cart[id];
      return `
        <div class="cart-line">
          <div class="cart-line-info">
            <div class="cart-line-name">${item.name}</div>
            <div class="cart-line-price">${qty} × ${fmt(item.price)} ${RESTAURANT.currency} = ${fmt(item.price*qty)} ${RESTAURANT.currency}</div>
          </div>
          <div class="qty-stepper">
            <button data-action="inc" data-id="${id}" aria-label="زيادة">+</button>
            <span>${qty}</span>
            <button data-action="dec" data-id="${id}" aria-label="إنقاص">−</button>
          </div>
        </div>`;
    }).join("");
 
    cartBody.innerHTML = `
      <div id="cartLines">${linesHtml}</div>
      <div class="cart-section-label">بياناتك</div>
      <div class="cart-notes">
        <label for="custName">الاسم</label>
        <input type="text" id="custName" class="field" placeholder="مثال: أحمد محمود" value="${custNameVal}">
        <p class="field-error">فضلاً اكتب اسمك</p>
      </div>
      <div class="cart-notes" style="margin-top:1rem;">
        <label for="custPhone">رقم الجوال (اختياري)</label>
        <input type="tel" id="custPhone" class="field" placeholder="07xxxxxxxx" value="${custPhoneVal}">
      </div>
      <div class="cart-notes" style="margin-top:1rem;">
        <label for="custNotes">ملاحظات على الطلب (اختياري)</label>
        <textarea id="custNotes" class="field" placeholder="مثال: بدون بصل، توصيل لعند بوابة المبنى...">${custNotesVal}</textarea>
      </div>
    `;
 
    // preserve typed values across re-renders + wire up live sync
    const nameInput = document.getElementById("custName");
    const phoneInput = document.getElementById("custPhone");
    const notesInput = document.getElementById("custNotes");
    nameInput.addEventListener("input", () => { custNameVal = nameInput.value; nameInput.classList.remove("invalid"); });
    phoneInput.addEventListener("input", () => { custPhoneVal = phoneInput.value; });
    notesInput.addEventListener("input", () => { custNotesVal = notesInput.value; });
  }
 
  // ---------- checkout: build WhatsApp message ----------
  const btnCheckout = document.getElementById("btnCheckout");
  const orderToast = document.getElementById("orderToast");
 
  function showToast(text){
    document.getElementById("orderToastText").textContent = text;
    orderToast.classList.add("show");
    setTimeout(() => orderToast.classList.remove("show"), 3200);
  }
 
  btnCheckout.addEventListener("click", () => {
    const nameInput = document.getElementById("custName");
    const name = (nameInput.value || "").trim();
 
    if(!name){
      nameInput.classList.add("invalid");
      nameInput.focus();
      return;
    }
    nameInput.classList.remove("invalid");
 
    const phone = (document.getElementById("custPhone").value || "").trim();
    const notes = (document.getElementById("custNotes").value || "").trim();
 
    const ids = Object.keys(cart);
    if(ids.length === 0) return;
 
    // ---- build formatted order message ----
    let msg = `*طلب جديد — ${RESTAURANT.name}*\n`;
    msg += `━━━━━━━━━━━━━━━\n`;
    msg += `*الزبون:* ${name}\n`;
    if(phone) msg += `*الجوال:* ${phone}\n`;
    msg += `━━━━━━━━━━━━━━━\n`;
    msg += `*تفاصيل الطلب:*\n`;
    ids.forEach(id => {
      const item = DISH_LOOKUP[id];
      const qty = cart[id];
      msg += `• ${item.name} × ${qty} — ${fmt(item.price*qty)} ${RESTAURANT.currency}\n`;
    });
    msg += `━━━━━━━━━━━━━━━\n`;
    msg += `*المجموع الكلي: ${fmt(cartTotal())} ${RESTAURANT.currency}*\n`;
    if(notes){
      msg += `━━━━━━━━━━━━━━━\n`;
      msg += `*ملاحظات الزبون:*\n${notes}\n`;
    }
    msg += `━━━━━━━━━━━━━━━\n`;
    msg += `_تم الإرسال من منيو ${RESTAURANT.name} الإلكتروني_`;
 
    const waNumber = (RESTAURANT.whatsapp || "").replace(/[^0-9]/g,"");
    const waUrl = `https://wa.me/${waNumber}?text=${encodeURIComponent(msg)}`;
 
    window.open(waUrl, "_blank", "noopener");
 
    // reset cart after sending
    Object.keys(cart).forEach(id => delete cart[id]);
    custNameVal = ""; custPhoneVal = ""; custNotesVal = "";
    renderAllAddRows();
    updateFab();
    closeCart();
    showToast("تم تجهيز طلبك — أكمل الإرسال من واتساب");
  });
 
})();
</script>
</body>
</html>
