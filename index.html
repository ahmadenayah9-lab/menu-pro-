<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القائمة الرقمية | Menu Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --gold: #e7ad3e;
      --gold-light: #ffd76b;
      --bg: #0d0d0d;
      --card-bg: #1a1a1a;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --border: #2a2a2a;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 100px; line-height: 1.6; }

    /* Header & Hero */
    header { background: linear-gradient(180deg, rgba(231,173,62,0.15) 0%, rgba(13,13,13,1) 100%); padding: 30px 20px 20px; text-align: center; border-bottom: 1px solid var(--border); }
    .brand-logo { font-size: 3rem; margin-bottom: 5px; }
    h1 { font-size: 1.8rem; font-weight: 800; color: var(--gold-light); }
    p.sub { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 15px; }
    
    .badges { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .badge { background: var(--card-bg); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; color: #ddd; }

    /* Layout Container */
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }

    /* Special Offer Banner */
    .offer-banner { background: linear-gradient(135deg, #2a1f0c 0%, var(--card-bg) 100%); border: 1px solid var(--gold); border-radius: var(--radius); padding: 20px; margin-bottom: 25px; position: relative; overflow: hidden; display: none; }
    .offer-tag { position: absolute; top: 12px; left: 12px; background: var(--gold); color: #000; font-weight: 700; font-size: 0.75rem; padding: 4px 10px; border-radius: 10px; }
    .offer-title { font-size: 1.2rem; font-weight: 700; color: var(--gold-light); margin-bottom: 5px; }
    .offer-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px; }
    .offer-price { font-size: 1.3rem; font-weight: 800; color: #fff; }
    .offer-price del { font-size: 0.9rem; color: #777; margin-left: 8px; }

    /* Search & Categories */
    .search-box { width: 100%; background: var(--card-bg); border: 1px solid var(--border); padding: 14px 18px; border-radius: 12px; color: #fff; font-size: 1rem; outline: none; margin-bottom: 20px; transition: 0.3s; }
    .search-box:focus { border-color: var(--gold); }
    
    .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 25px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 18px; border-radius: 25px; white-space: nowrap; cursor: pointer; font-weight: 600; transition: 0.3s; }
    .cat-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }

    /* Product Grid & Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; }
    .card:hover { border-color: rgba(231,173,62,0.4); transform: translateY(-2px); }
    .card-img { width: 100%; height: 160px; object-fit: cover; cursor: pointer; }
    .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .card-title { font-size: 1.05rem; font-weight: 700; }
    .card-rating { font-size: 0.8rem; color: var(--gold-light); }
    .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; flex-grow: 1; }
    .card-foot { display: flex; justify-content: space-between; align-items: center; }
    .price { font-weight: 800; font-size: 1.1rem; color: var(--gold-light); }
    .btn-add { background: var(--gold); color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn-add:active { transform: scale(0.95); }

    /* Cart Floating Bar & Drawer */
    .cart-float { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: calc(100% - 40px); max-width: 760px; background: var(--gold); color: #000; padding: 14px 20px; border-radius: 30px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; box-shadow: 0 10px 25px rgba(231,173,62,0.3); cursor: pointer; z-index: 99; }
    
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000; }
    .drawer-overlay.active { opacity: 1; pointer-events: all; }
    .drawer { position: fixed; bottom: 0; left: 0; right: 0; max-height: 85vh; background: #141414; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 25px; transform: translateY(100%); transition: 0.3s ease-out; z-index: 1001; overflow-y: auto; }
    .drawer.active { transform: translateY(0); }

    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
    
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: var(--card-bg); padding: 12px; border-radius: 12px; }
    .qty-controls { display: flex; align-items: center; gap: 10px; }
    .qty-btn { width: 28px; height: 28px; background: #333; color: #fff; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }

    .form-group { margin-top: 15px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
    .form-input { width: 100%; background: var(--card-bg); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; color: #fff; outline: none; }
    
    .btn-submit { width: 100%; background: #25D366; color: #fff; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; margin-top: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }

    /* Modal & Toast */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 2000; padding: 20px; }
    .modal.active { opacity: 1; pointer-events: all; }
    .modal-content { background: var(--card-bg); border-radius: var(--radius); max-width: 450px; width: 100%; overflow: hidden; border: 1px solid var(--border); }

    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-50px); background: var(--gold); color: #000; padding: 10px 20px; border-radius: 20px; font-weight: 700; opacity: 0; transition: 0.3s; z-index: 3000; }
    .toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand-logo" id="logo">🔥</div>
    <h1 id="restaurantName">اسم المطعم</h1>
    <p class="sub" id="subtitle">وصف المطعم</p>
    <div class="badges">
      <span class="badge" id="rating">⭐ 0.0</span>
      <span class="badge" id="deliveryTime">⏱️ 0 دقيقة</span>
      <span class="badge" id="openingHours">🕐 ساعات العمل</span>
    </div>
  </header>

  <div class="container">
    <!-- Featured Offer Banner -->
    <div class="offer-banner" id="offerBanner">
      <span class="offer-tag" id="offerTag">عرض خاص</span>
      <div class="offer-title" id="offerTitle">اسم العرض</div>
      <div class="offer-desc" id="offerDesc">تفاصيل العرض</div>
      <div style="display:flex; justify-style:space-between; align-items:center;">
        <div class="offer-price"><span id="offerPrice">0</span> <small class="curr"></small> <del id="offerOldPrice"></del></div>
        <button class="btn-add" id="offerAddBtn">طلب العرض الآن</button>
      </div>
    </div>

    <!-- Search & Categories -->
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن وجبة أو مشروب...">
    <div class="categories" id="categoriesContainer"></div>

    <!-- Food Grid -->
    <div class="grid" id="foodGrid"></div>
  </div>

  <!-- Floating Cart Bar -->
  <div class="cart-float" onclick="toggleCart(true)">
    <span>🛒 سلة الطلبات (<span id="cartCount">0</span>)</span>
    <span><span id="cartTotal">0.00</span> <span class="curr"></span></span>
  </div>

  <!-- Cart Drawer Overlay -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="toggleCart(false)"></div>
  <div class="drawer" id="cartDrawer">
    <div class="drawer-header">
      <h3>تفاصيل الطلب</h3>
      <button class="close-btn" onclick="toggleCart(false)">&times;</button>
    </div>
    <div id="cartItems"></div>
    
    <div class="form-group">
      <label>الاسم الكامل</label>
      <input type="text" id="custName" class="form-input" placeholder="أدخل اسمك الكريم">
    </div>
    <div class="form-group">
      <label>نوع الطلب</label>
      <select id="orderType" class="form-input">
        <option value="توصيل 🛵">توصيل للمنزل</option>
        <option value="استلام من الفرع 🏃">استلام من الفرع</option>
        <option value="داخل المطعم 🍽️">طلب على الطاولة</option>
      </select>
    </div>
    <div class="form-group">
      <label>العنوان / رقم الطاولة</label>
      <input type="text" id="custLoc" class="form-input" placeholder="اسم المنطقة أو رقم الطاولة">
    </div>
    <div class="form-group">
      <label>ملاحظات إضافية</label>
      <input type="text" id="custNote" class="form-input" placeholder="بدون بصل، صوص إضافي...">
    </div>

    <button class="btn-submit" onclick="sendWhatsAppOrder()">
      إرسال الطلب عبر الواتساب 💬
    </button>
  </div>

  <!-- Food Item Modal -->
  <div class="modal" id="itemModal" onclick="closeModal(event)">
    <div class="modal-content">
      <img id="mImg" src="" style="width:100%; height:220px; object-fit:cover;">
      <div style="padding:20px;">
        <h3 id="mTitle" style="margin-bottom:8px;"></h3>
        <p id="mDesc" style="color:var(--text-muted); font-size:0.9rem; margin-bottom:15px;"></p>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:1.3rem; font-weight:800; color:var(--gold-light);" id="mPrice"></span>
          <button class="btn-add" id="mAddBtn">إضافة للسلة</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <!-- Config Import -->
  <script src="config.js"></script>

  <!-- Main Logic Script -->
  <script>
    /* =========================
       MOCK DATASET
    ========================= */
    const foods = [
      { id: 1, name: "مشاوي مشكلة فاخرة", cat: "المشاوي", price: 8.50, rating: "4.9", desc: "سيخ كباب، سيخ شيش طاووق، سيخ شقف مع البطاطا والمقبلات.", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=600&q=80" },
      { id: 2, name: "كباب حلبي بالبندورة", cat: "المشاوي", price: 7.00, rating: "4.8", desc: "كباب لحم غنم طازج مشوي مع صلصة البندورة المشوية.", img: "https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?auto=format&fit=crop&w=600&q=80" },
      { id: 3, name: "شيش طاووق على الفحم", cat: "المشاوي", price: 6.50, rating: "4.7", desc: "قطع دجاج متبلة بالأعشاب والثوم مشوية على الفحم.", img: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?auto=format&fit=crop&w=600&q=80" },
      { id: 4, name: "سلطة تبولة لبنانية", cat: "المقبلات", price: 2.50, rating: "4.6", desc: "بقدونس طازج، برغل، بندورة، زيت زيتون وحامض.", img: "https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=600&q=80" },
      { id: 5, name: "حمص باللحم والصنوبر", cat: "المقبلات", price: 3.50, rating: "4.9", desc: "حمص ناعم يعلوه لحم غنم مفروم وصنوبر محمص.", img: "https://images.unsplash.com/photo-1577906096429-f73c2c312435?auto=format&fit=crop&w=600&q=80" },
      { id: 6, name: "عصير برتقال طازج", cat: "المشروبات", price: 2.00, rating: "4.8", desc: "برتقال طبيعي معصور طازج بدون إضافة سكر.", img: "https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=600&q=80" }
    ];

    /* =========================
       APP INITIALIZATION
    ========================= */
    const config = window.MENU_CONFIG || {};
    let cart = [];
    let activeCategory = "الكل";

    document.addEventListener("DOMContentLoaded", () => {
      applyTheme();
      initUI();
      renderCategories();
      renderProducts();

      document.getElementById("searchInput").addEventListener("input", renderProducts);
    });

    function applyTheme() {
      if (config.theme) {
        document.documentElement.style.setProperty('--gold', config.theme.gold || '#e7ad3e');
        document.documentElement.style.setProperty('--gold-light', config.theme.goldLight || '#ffd76b');
        document.documentElement.style.setProperty('--bg', config.theme.background || '#0d0d0d');
        document.documentElement.style.setProperty('--card-bg', config.theme.cardBg || '#1a1a1a');
      }
    }

    function initUI() {
      document.getElementById("logo").innerText = config.logo || "🔥";
      document.getElementById("restaurantName").innerText = config.restaurantName || "المطعم";
      document.getElementById("subtitle").innerText = config.subtitle || "";
      document.getElementById("rating").innerText = "⭐ " + (config.rating || "4.9");
      document.getElementById("deliveryTime").innerText = "🛵 " + (config.deliveryTime || "30 دقيقة");
      document.getElementById("openingHours").innerText = "🕐 " + (config.openingHours || "");

      document.querySelectorAll(".curr").forEach(el => el.innerText = config.currency || "JOD");

      // Setup Offer
      if (config.offer && config.offer.enabled) {
        const off = config.offer;
        const banner = document.getElementById("offerBanner");
        banner.style.display = "block";
        document.getElementById("offerTag").innerText = off.label;
        document.getElementById("offerTitle").innerText = off.name;
        document.getElementById("offerDesc").innerText = off.description;
        document.getElementById("offerPrice").innerText = off.price.toFixed(2);
        document.getElementById("offerOldPrice").innerText = off.oldPrice ? off.oldPrice.toFixed(2) + " " + config.currency : "";
        document.getElementById("offerAddBtn").onclick = () => addToCart(off.productId);
      }
    }

    /* =========================
       RENDER PRODUCTS & FILTERS
    ========================= */
    function renderCategories() {
      const cats = ["الكل", ...new Set(foods.map(f => f.cat))];
      const container = document.getElementById("categoriesContainer");
      container.innerHTML = cats.map(c => `
        <button class="cat-btn ${c === activeCategory ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>
      `).join("");
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const grid = document.getElementById("foodGrid");

      const filtered = foods.filter(item => {
        const matchesCat = activeCategory === "الكل" || item.cat === activeCategory;
        const matchesSearch = item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:var(--text-muted); padding:30px;">لا توجد نتائج مطابقة لبحثك.</p>`;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="card">
          <img class="card-img" src="${item.img}" alt="${item.name}" onclick="openModal(${item.id})">
          <div class="card-body">
            <div class="card-head">
              <span class="card-title">${item.name}</span>
              <span class="card-rating">⭐ ${item.rating}</span>
            </div>
            <p class="card-desc">${item.desc}</p>
            <div class="card-foot">
              <span class="price">${item.price.toFixed(2)} <small>${config.currency}</small></span>
              <button class="btn-add" onclick="addToCart(${item.id})">+ إضافة</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    /* =========================
       CART & DRAWER SYSTEM
    ========================= */
    function addToCart(id) {
      const item = foods.find(f => f.id === id);
      if (!item) return;

      const existing = cart.find(c => c.id === id);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...item, qty: 1 });
      }

      updateCartUI();
      showToast(`تمت إضافة "${item.name}" إلى السلة`);
    }

    function updateCartUI() {
      const countEl = document.getElementById("cartCount");
      const totalEl = document.getElementById("cartTotal");
      const itemsContainer = document.getElementById("cartItems");

      const totalItems = cart.reduce((sum, i) => sum + i.qty, 0);
      const totalPrice = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

      countEl.innerText = totalItems;
      totalEl.innerText = totalPrice.toFixed(2);

      if (cart.length === 0) {
        itemsContainer.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:20px;">السلة فارغة حالياً 🛒</p>`;
        return;
      }

      itemsContainer.innerHTML = cart.map(i => `
        <div class="cart-item">
          <div>
            <div style="font-weight:700;">${i.name}</div>
            <div style="font-size:0.85rem; color:var(--gold-light);">${(i.price * i.qty).toFixed(2)} ${config.currency}</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${i.id}, -1)">-</button>
            <span>${i.qty}</span>
            <button class="qty-btn" onclick="changeQty(${i.id}, 1)">+</button>
          </div>
        </div>
      `).join("");
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
      }

      updateCartUI();
    }

    function toggleCart(open) {
      document.getElementById("drawerOverlay").classList.toggle("active", open);
      document.getElementById("cartDrawer").classList.toggle("active", open);
    }

    /* =========================
       WHATSAPP ORDERING
    ========================= */
    function sendWhatsAppOrder() {
      if (cart.length === 0) {
        showToast("يرجى إضافة وجبات إلى السلة أولاً!");
        return;
      }

      const name = document.getElementById("custName").value.trim();
      const type = document.getElementById("orderType").value;
      const loc = document.getElementById("custLoc").value.trim();
      const note = document.getElementById("custNote").value.trim();

      if (!name) {
        showToast("يرجى إدخال الاسم الكامل");
        return;
      }

      let text = `*طلب جديد من ${config.restaurantName}* 🍽️\n\n`;
      text += `👤 *الاسم:* ${name}\n`;
      text += `🛵 *نوع الطلب:* ${type}\n`;
      if (loc) text += `📍 *العنوان / الطاولة:* ${loc}\n`;
      if (note) text += `📝 *ملاحظات:* ${note}\n`;

      text += `\n*تفاصيل الوجبات:*\n`;
      cart.forEach((item, idx) => {
        text += `${idx + 1}. ${item.name} × ${item.qty} = ${(item.price * item.qty).toFixed(2)} ${config.currency}\n`;
      });

      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      text += `\n💰 *الإجمالي النهائي:* ${total.toFixed(2)} ${config.currency}`;

      const waUrl = `https://wa.me/${config.whatsapp}?text=${encodeURIComponent(text)}`;
      window.open(waUrl, "_blank");
    }

    /* =========================
       MODAL & TOAST
    ========================= */
    function openModal(id) {
      const item = foods.find(f => f.id === id);
      if (!item) return;

      document.getElementById("mImg").src = item.img;
      document.getElementById("mTitle").innerText = item.name;
      document.getElementById("mDesc").innerText = item.desc;
      document.getElementById("mPrice").innerText = `${item.price.toFixed(2)} ${config.currency}`;
      
      const addBtn = document.getElementById("mAddBtn");
      addBtn.onclick = () => {
        addToCart(item.id);
        closeModal();
      };

      document.getElementById("itemModal").classList.add("active");
    }

    function closeModal(e) {
      if (!e || e.target.id === "itemModal") {
        document.getElementById("itemModal").classList.remove("active");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.innerText = msg;
      toast.classList.add("active");
      setTimeout(() => toast.classList.remove("active"), 2500);
    }
  </script>
</body>
</html>
